naftiko: 1.0.0-alpha2
info:
  label: Apache Pig API — Jobs
  description: 'Apache Pig API — Jobs. 5 operations. Lead operation: Apache Pig List Jobs. Self-contained Naftiko capability
    covering one Apache Pig business surface.'
  tags:
  - Apache Pig
  - Jobs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    APACHE_PIG_API_KEY: APACHE_PIG_API_KEY
capability:
  consumes:
  - type: http
    namespace: apache-pig-jobs
    baseUri: https://{host}/pig
    description: Apache Pig API — Jobs business capability. Self-contained, no shared references.
    resources:
    - name: jobs
      path: /jobs
      operations:
      - name: listjobs
        method: GET
        description: Apache Pig List Jobs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
          description: Filter by job status
        - name: limit
          in: query
          type: integer
          description: Maximum number of jobs to return
      - name: submitjob
        method: POST
        description: Apache Pig Submit Job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: jobs-jobId
      path: /jobs/{jobId}
      operations:
      - name: getjob
        method: GET
        description: Apache Pig Get Job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: killjob
        method: DELETE
        description: Apache Pig Kill Job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: jobs-jobId-logs
      path: /jobs/{jobId}/logs
      operations:
      - name: getjoblogs
        method: GET
        description: Apache Pig Get Job Logs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: apache-pig-jobs-rest
    port: 8080
    description: REST adapter for Apache Pig API — Jobs. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/jobs
      name: jobs
      description: REST surface for jobs.
      operations:
      - method: GET
        name: listjobs
        description: Apache Pig List Jobs
        call: apache-pig-jobs.listjobs
        with:
          status: rest.status
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: submitjob
        description: Apache Pig Submit Job
        call: apache-pig-jobs.submitjob
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/jobs/{jobid}
      name: jobs-jobid
      description: REST surface for jobs-jobId.
      operations:
      - method: GET
        name: getjob
        description: Apache Pig Get Job
        call: apache-pig-jobs.getjob
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: killjob
        description: Apache Pig Kill Job
        call: apache-pig-jobs.killjob
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/jobs/{jobid}/logs
      name: jobs-jobid-logs
      description: REST surface for jobs-jobId-logs.
      operations:
      - method: GET
        name: getjoblogs
        description: Apache Pig Get Job Logs
        call: apache-pig-jobs.getjoblogs
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: apache-pig-jobs-mcp
    port: 9090
    transport: http
    description: MCP adapter for Apache Pig API — Jobs. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: apache-pig-list-jobs
      description: Apache Pig List Jobs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: apache-pig-jobs.listjobs
      with:
        status: tools.status
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: apache-pig-submit-job
      description: Apache Pig Submit Job
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: apache-pig-jobs.submitjob
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: apache-pig-get-job
      description: Apache Pig Get Job
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: apache-pig-jobs.getjob
      outputParameters:
      - type: object
        mapping: $.
    - name: apache-pig-kill-job
      description: Apache Pig Kill Job
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: apache-pig-jobs.killjob
      outputParameters:
      - type: object
        mapping: $.
    - name: apache-pig-get-job-logs
      description: Apache Pig Get Job Logs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: apache-pig-jobs.getjoblogs
      outputParameters:
      - type: object
        mapping: $.
