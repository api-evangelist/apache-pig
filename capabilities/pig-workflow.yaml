naftiko: "1.0.0-alpha1"
info:
  label: "Apache Pig Data Processing Workflow"
  description: "Workflow for submitting, monitoring, and managing Pig Latin data analysis jobs on Hadoop clusters."
  tags:
    - Apache Pig
    - Big Data
    - Data Analysis
    - Hadoop
    - ETL
  created: "2026-04-19"
  modified: "2026-04-19"
binds:
  - namespace: env
    keys:
      PIG_API_KEY: PIG_API_KEY
capability:
  consumes:
    - type: http
      namespace: pig
      baseUri: https://localhost:8080/pig
      description: "Apache Pig REST API"
      resources:
        - name: jobs
          path: /jobs
          description: "Pig job management"
          operations:
            - name: listJobs
              method: GET
              description: "List Pig jobs"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: submitJob
              method: POST
              description: "Submit a Pig script"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
  exposes:
    - type: rest
      port: 8080
      namespace: pig-api
      description: "Unified REST API for Pig data processing."
      resources:
        - path: /v1/jobs
          name: jobs
          operations:
            - method: GET
              name: list-jobs
              description: "List Pig jobs"
              call: "pig.listJobs"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: submit-job
              description: "Submit Pig script"
              call: "pig.submitJob"
              outputParameters:
                - type: object
                  mapping: "$."
    - type: mcp
      port: 9090
      namespace: pig-mcp
      transport: http
      description: "MCP server for AI-assisted Pig data processing."
      tools:
        - name: list-jobs
          description: "List all Pig data processing jobs"
          hints:
            readOnly: true
          call: "pig.listJobs"
          outputParameters:
            - type: object
              mapping: "$."
        - name: submit-job
          description: "Submit a Pig Latin script for execution"
          hints:
            readOnly: false
          call: "pig.submitJob"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-job
          description: "Get status and details of a Pig job"
          hints:
            readOnly: true
          call: "pig.getJob"
          outputParameters:
            - type: object
              mapping: "$."
        - name: kill-job
          description: "Kill a running Pig job"
          hints:
            readOnly: false
            destructive: true
          call: "pig.killJob"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-job-logs
          description: "Get execution logs for a Pig job"
          hints:
            readOnly: true
          call: "pig.getJobLogs"
          outputParameters:
            - type: object
              mapping: "$."
        - name: validate-script
          description: "Validate a Pig Latin script for syntax errors"
          hints:
            readOnly: true
          call: "pig.validateScript"
          outputParameters:
            - type: object
              mapping: "$."
